[project]
name = "snomniman"
version = "0.2.0"
description = "SNOMNIMAN - reproducible analysis of scattering-type SNOM (s-SNOM) and nano-FTIR data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Demetrios Koutsoukos" }]
keywords = ["snomniman", "snom", "s-SNOM", "nano-FTIR", "near-field", "microscopy", "spectroscopy"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "xarray>=2024.1.0",
    "zarr>=2.17",
    "h5py>=3.10",
    "matplotlib>=3.8",
]

# Runtime extra: the interactive desktop GUI. Kept optional so the entire
# scientific backend installs and tests without Qt (Rule 4 / ADR-0007).
[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

# The frozen-executable entry point (deployment-strategy.md Phase 1). A
# `gui-scripts` entry (not `console_scripts`) so an installed launcher has no
# console window, matching how the frozen exe itself will behave.
[project.gui-scripts]
snomniman-gui = "snomniman.gui.app:run"

# Dev tooling (PEP 735). `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
# PyInstaller freeze tooling (deployment-strategy.md Phase 1). Not part of the
# default `dev` group - only pulled in with `uv sync --group packaging --extra
# gui` when actually building a distributable, so ordinary backend dev/CI never
# installs it.
packaging = [
    "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snomniman"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "NPY", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["snomniman"]

[tool.mypy]
# Runtime floor is 3.11 (requires-python), but mypy analyzes at 3.12: numpy's
# type stubs use PEP 695 `type` statements that mypy only parses under >=3.12.
# Ruff still targets py311, so 3.11-incompatible *syntax* in our code is caught.
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
files = ["src", "tests"]
strict = true
warn_unused_configs = true

# Third-party libraries without complete type stubs.
[[tool.mypy.overrides]]
module = ["pyqtgraph.*", "zarr.*", "scipy.*", "mpl_toolkits.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
