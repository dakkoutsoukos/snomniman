name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # GUI tests run headless via Qt's offscreen platform plugin.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # System libraries the Qt offscreen plugin needs to load on Linux.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 fontconfig

      # Include the optional gui extra so mypy sees the PySide6 stubs and the
      # GUI widget tests run (the backend itself stays Qt-free, enforced below).
      - name: Install dependencies
        run: uv sync --extra gui

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest — includes backend Qt-free invariant)
        run: uv run pytest
